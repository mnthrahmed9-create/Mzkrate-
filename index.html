
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>مذكّراتي | My Diary</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#eeeae3;color:#292820;
 font-family:Tahoma,Arial,sans-serif;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
header{
 background:#fff;padding:17px 18px;
 display:flex;align-items:center;justify-content:space-between;
 box-shadow:0 2px 10px #0000000c;
}
.logo{font-size:21px;font-weight:bold;color:#69543d}
.logo small{display:block;font-size:11px;color:#999;margin-top:4px}
.header-btn{
 border:0;background:#f1e9dc;border-radius:13px;
 padding:11px 15px;color:#634b30;font-weight:bold;
}
main{max-width:700px;margin:auto;padding:18px}
.search{
 width:100%;padding:15px;border:1px solid #e3ddd3;
 border-radius:14px;background:white;outline:none;
 margin:5px 0 17px;
}
.section-title{font-size:17px;font-weight:bold;margin:12px 0}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.note{
 min-height:165px;background:#fffdf7;padding:16px;
 border-radius:5px 16px 5px 16px;
 box-shadow:0 4px 12px #0000000c;
 border-right:4px solid #c7a77c;
 position:relative;overflow:hidden;
}
.note:active{transform:scale(.98)}
.note h3{margin:0 0 10px;font-size:17px}
.note p{
 color:#777;font-size:13px;line-height:1.8;
 overflow:hidden;display:-webkit-box;
 -webkit-line-clamp:4;-webkit-box-orient:vertical;
 white-space:pre-wrap;
}
.note time{font-size:10px;color:#aaa}
.star{position:absolute;left:12px;top:12px;color:#c69a37}
.empty{text-align:center;color:#999;padding:45px 10px;grid-column:1/-1}
.fab{
 position:fixed;bottom:25px;left:22px;
 width:62px;height:62px;border:0;border-radius:50%;
 background:#70583b;color:white;font-size:34px;
 box-shadow:0 5px 18px #0003;
}
#editor{
 display:none;position:fixed;inset:0;z-index:10;
 background:#eeeae3;overflow-y:auto;
}
.editor-head{
 position:sticky;top:0;background:#fff;
 padding:12px;display:flex;align-items:center;
 justify-content:space-between;gap:8px;
 box-shadow:0 2px 8px #0001;z-index:2;
}
.editor-head button{
 border:0;border-radius:11px;background:#f0e9df;
 padding:10px 13px;color:#59452e;
}
.save-status{font-size:11px;color:#888}
.paper-wrap{max-width:700px;margin:16px auto;padding:0 12px 30px}
.paper{
 background:#fffdf7;
 min-height:calc(100dvh - 105px);
 padding:25px 22px;
 box-shadow:0 3px 20px #00000012;
 position:relative;
 background-image:linear-gradient(transparent 34px,#e8e3d9 35px);
 background-size:100% 35px;
}
.paper-date{
 color:#9c8b73;font-size:12px;
 margin-bottom:20px;
}
.paper-title{
 width:100%;border:0;outline:none;
 background:transparent;font-size:23px;
 font-weight:bold;color:#493b2b;
 margin-bottom:17px;
 padding:5px 0;
}
.paper-body{
 width:100%;min-height:65vh;
 border:0;outline:none;resize:none;
 background:transparent;
 font-size:17px;line-height:35px;
 color:#37332d;padding:0;
}
.paper-body::placeholder{color:#c5bdb0}
.editor-tools{
 display:flex;gap:8px;flex-wrap:wrap;
 margin-bottom:13px;
}
.tool{
 border:0;background:#eee6d9;
 border-radius:9px;padding:9px 13px;
 color:#624c32;
}
.delete{color:#a43d35}
@media(max-width:390px){
 .notes{grid-template-columns:1fr}
 .paper{padding:20px 16px}
}
</style>
</head>
<body>

<header>
 <div class="logo">📖 مذكّراتي
  <small>مساحتك الخاصة لأفكارك</small>
 </div>
 <button class="header-btn" onclick="showFavorites()">⭐ المفضلة</button>
</header>

<main id="home">
 <input class="search" id="search"
 placeholder="🔍 ابحث في مذكراتك..." oninput="render()">
 <div class="section-title" id="listTitle">كل مذكراتي</div>
 <div class="notes" id="notes"></div>
</main>

<button class="fab" onclick="createNote()">+</button>

<div id="editor">
 <div class="editor-head">
  <button onclick="closeEditor()">← رجوع</button>
  <span class="save-status" id="status">تم الحفظ</span>
  <button onclick="toggleFavorite()">⭐</button>
  <button class="delete" onclick="deleteNote()">🗑</button>
 </div>

 <div class="paper-wrap">
  <div class="editor-tools">
   <button class="tool" onclick="insertText('— ')">— فاصل</button>
   <button class="tool" onclick="insertText('❤️ ')">❤️</button>
   <button class="tool" onclick="insertText('📌 ')">📌</button>
  </div>

  <div class="paper">
   <div class="paper-date" id="date"></div>
   <input class="paper-title" id="title"
   placeholder="اكتب عنوان مذكرتك هنا...">
   <textarea class="paper-body" id="content"
   placeholder="ابدأ الكتابة هنا...

هذه ورقتك الخاصة، اكتب كل ما تريد..."></textarea>
  </div>
 </div>
</div>

<script>
let notes=JSON.parse(localStorage.getItem("my_diary_notes")||"[]");
let currentId=null;
let favoritesOnly=false;
let timer=null;

function saveAll(){
 localStorage.setItem("my_diary_notes",JSON.stringify(notes));
}

function createNote(){
 const note={
  id:Date.now(),
  title:"",
  content:"",
  favorite:false,
  date:new Date().toISOString()
 };
 notes.unshift(note);
 currentId=note.id;
 saveAll();
 openEditor();
}

function openEditor(){
 const note=notes.find(n=>n.id===currentId);
 if(!note)return;
 document.getElementById("editor").style.display="block";
 document.getElementById("title").value=note.title;
 document.getElementById("content").value=note.content;
 document.getElementById("date").textContent=
  new Date(note.date).toLocaleString("ar-IQ");
 document.getElementById("status").textContent="تم الحفظ";
}

function closeEditor(){
 saveCurrent();
 document.getElementById("editor").style.display="none";
 render();
}

function saveCurrent(){
 if(currentId===null)return;
 const note=notes.find(n=>n.id===currentId);
 if(!note)return;

 note.title=document.getElementById("title").value;
 note.content=document.getElementById("content").value;
 note.updated=new Date().toISOString();
 saveAll();
 document.getElementById("status").textContent="✓ تم الحفظ";
}

function autoSave(){
 document.getElementById("status").textContent="جارٍ الحفظ...";
 clearTimeout(timer);
 timer=setTimeout(saveCurrent,250);
}

document.getElementById("title").addEventListener("input",autoSave);
document.getElementById("content").addEventListener("input",autoSave);

function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=document.getElementById("notes");
 list.innerHTML="";
 let filtered=notes.filter(n=>
  (!favoritesOnly||n.favorite)&&
  ((n.title+" "+n.content).toLowerCase().includes(q))
 );

 document.getElementById("listTitle").textContent=
 favoritesOnly?"⭐ مذكراتي المفضلة":"كل مذكراتي";

 if(!filtered.length){
  list.innerHTML='<div class="empty">📖<br><br>لا توجد مذكرات هنا بعد.<br>اضغط + لكتابة أول مذكرة.</div>';
  return;
 }

 filtered.forEach(n=>{
  const card=document.createElement("div");
  card.className="note";
  const h=document.createElement("h3");
  h.textContent=n.title||"مذكرة جديدة";
  const p=document.createElement("p");
  p.textContent=n.content||"ابدأ بكتابة أفكارك...";
  const time=document.createElement("time");
  time.textContent=new Date(n.updated||n.date).toLocaleDateString("ar-IQ");
  card.append(h,p,time);
  if(n.favorite){
   const star=document.createElement("span");
   star.className="star";
   star.textContent="★";
   card.append(star);
  }
  card.onclick=()=>{
   currentId=n.id;
   openEditor();
  };
  list.append(card);
 });
}

function toggleFavorite(){
 const note=notes.find(n=>n.id===currentId);
 if(!note)return;
 note.favorite=!note.favorite;
 saveAll();
 document.getElementById("status").textContent=
 note.favorite?"⭐ أضيفت للمفضلة":"أزيلت من المفضلة";
}

function showFavorites(){
 favoritesOnly=!favoritesOnly;
 render();
}

function deleteNote(){
 if(!confirm("هل تريد حذف هذه المذكرة نهائياً؟"))return;
 notes=notes.filter(n=>n.id!==currentId);
 currentId=null;
 saveAll();
 document.getElementById("editor").style.display="none";
 render();
}

function insertText(value){
 const input=document.getElementById("content");
 const start=input.selectionStart;
 const end=input.selectionEnd;
 input.setRangeText(value,start,end,"end");
 input.focus();
 autoSave();
}

render();
</script>
</body>
</html>
